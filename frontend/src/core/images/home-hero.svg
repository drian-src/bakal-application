<svg width="560" height="360" viewBox="0 0 560 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a3a"/>
      <stop offset="1" stop-color="#806286"/>
    </linearGradient>
    <radialGradient id="g2" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#806286" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a1a3a" stop-opacity="0"/>
