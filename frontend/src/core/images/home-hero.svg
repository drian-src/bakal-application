  </defs>

  <rect width="560" height="360" rx="16" fill="url(#g1)" />
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="white" fill-opacity="0.06"/>
    <rect x="260" y="20" width="240" height="160" rx="10" fill="white" fill-opacity="0.06"/>

    <g transform="translate(10,10)">
      <circle cx="40" cy="40" r="6" fill="#806286"/>
      <circle cx="70" cy="40" r="6" fill="#806286"/>
      <rect x="0" y="70" width="180" height="10" rx="3" fill="url(#g2)" />
    </g>

    <g transform="translate(280,30)">
      <rect x="10" y="10" width="120" height="80" rx="8" fill="#efe8f1" fill-opacity="0.06"/>
      <rect x="140" y="10" width="80" height="80" rx="8" fill="#efe8f1" fill-opacity="0.04"/>
    </g>
  </g>

  <!-- decorative glow -->
  <ellipse cx="420" cy="240" rx="180" ry="80" fill="url(#g2)" />
