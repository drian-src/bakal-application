<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="500" rx="20" fill="url(#hero-bg)"/>
  
  <!-- Shopping bag icon -->
  <g transform="translate(250, 150)">
    <rect x="10" y="30" width="80" height="100" rx="8" fill="white" fill-opacity="0.9"/>
    <path d="M30 30 Q50 10 70 30" stroke="white" stroke-width="4" fill="none"/>
    <circle cx="40" cy="60" r="4" fill="#806286"/>
    <circle cx="60" cy="60" r="4" fill="#806286"/>
    <circle cx="40" cy="85" r="4" fill="#806286"/>
    <circle cx="60" cy="85" r="4" fill="#806286"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="30" fill="white" fill-opacity="0.2"/>
  <circle cx="450" cy="380" r="40" fill="white" fill-opacity="0.15"/>
  <rect x="80" y="350" width="60" height="60" rx="12" fill="white" fill-opacity="0.2"/>
  <rect x="460" y="120" width="50" height="50" rx="10" fill="white" fill-opacity="0.2"/>
  
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a1a3a"/>
      <stop offset="1" stop-color="#806286"/>
