version: '3.9'

services:
  # Frontend - React Vite App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bakal-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - REACT_APP_API_URL=http://backend:3000/api
      - REACT_APP_ENV=development
    depends_on:
      - backend
    networks:
      - bakal-network

  # Backend - Express API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bakal-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/node_modules:/app/node_modules
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bakal-network

  # PostgreSQL Database (Optional - use Supabase in production)
  postgres:
    image: postgres:15-alpine
    container_name: bakal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bakal
      POSTGRES_USER: bakal_user
      POSTGRES_PASSWORD: bakal_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bakal_user']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakal-network

networks:
  bakal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
